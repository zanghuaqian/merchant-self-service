<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>商户自助处理 · 盛意旺</title>
  <link rel="stylesheet" href="assets/css/base.css?v=abn1">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(700px 360px at 10% -10%, #dbeafe 0%, transparent 55%),
        #f4f6f9;
      font-family: var(--font);
      color: var(--text-1);
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 28px 16px 48px; }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: var(--shadow-card);
      padding: 22px 18px;
    }
    .brand {
      font-size: 12px;
      font-weight: 700;
      color: var(--brand-strong);
      background: var(--brand-soft);
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; line-height: 1.4; }
    .sub { font-size: 13px; color: var(--text-2); line-height: 1.7; margin: 0 0 18px; }
    .steps { counter-reset: s; }
    .steps li {
      list-style: none;
      position: relative;
      padding: 12px 0 12px 36px;
      border-bottom: 1px dashed var(--line);
      font-size: 14px;
      line-height: 1.65;
    }
    .steps li:last-child { border-bottom: 0; }
    .steps li::before {
      counter-increment: s;
      content: counter(s);
      position: absolute;
      left: 0; top: 14px;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--brand-grad);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: grid;
      place-items: center;
    }
    .foot {
      margin-top: 18px;
      font-size: 12px;
      color: var(--text-3);
      line-height: 1.7;
      text-align: center;
    }
    .mch {
      font-size: 12.5px;
      background: #f7f9fc;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
      color: var(--text-2);
    }
    .btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      text-align: center;
      text-decoration: none;
      background: var(--brand-grad);
      color: #fff;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card"></div>
    <div class="foot">由盛意旺客服发送的处理指引 · 演示环境</div>
  </div>

  <script src="assets/js/mock.js?v=cs1"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var page = q.get('page') || 'guide';
      var key = q.get('key') || '';
      var mchId = q.get('mchId') || '';
      var title = q.get('title') || '自助处理指引';
      var m = mchId ? MSS.findByMchId(mchId) : null;
      var sol = MSS.SOLUTIONS[page] || MSS.SOLUTIONS[key] || null;

      var steps = (sol && sol.guide) || [
        '打开盛意旺 App 并登录对应商户账号。',
        '进入「助手 → 资金未到账」按页面提示完成处理。',
        '处理完成后可返回助手重新诊断，确认是否已恢复。'
      ];

      if (sol && sol.url) {
        location.replace(sol.url);
        return;
      }

      if (page === 'settle_settings' || page === 'settlement' || key === 'settlement') {
        location.replace('mp-settle-settings.html?mchId=' + encodeURIComponent(mchId || '') + '&from=action');
        return;
      }

      document.getElementById('card').innerHTML =
        '<div class="brand">盛意旺 · 商户处理</div>' +
        '<h1>' + title + '</h1>' +
        '<p class="sub">请按以下步骤完成操作。完成后资金出款将按系统规则自动恢复或于次日生效。</p>' +
        (m ? '<div class="mch">当前商户：' + m.name + '（商户号 ' + m.mchId + '）</div>' : '') +
        '<ol class="steps">' + steps.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol>' +
        '<a class="btn" href="wechat.html">打开公众号自助服务</a>';
    })();
  </script>
</body>
</html>
