<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诊断报告（客服查看）· 商户自助服务助手</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    body { background: #eef1f6; padding: 28px 16px 60px; }

    .rp-wrap { max-width: 720px; margin: 0 auto; }

    .rp-head {
      background: linear-gradient(135deg, #1f6feb, #1552c4);
      color: #fff;
      border-radius: 16px 16px 0 0;
      padding: 22px 24px;
    }

    .rp-head h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.2px; }
    .rp-head p { font-size: 12.5px; opacity: 0.85; margin-top: 7px; line-height: 1.7; }
    .rp-head .rp-tags { display: flex; gap: 7px; margin-top: 13px; flex-wrap: wrap; }
    .rp-head .rp-tags span {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 11.5px;
      font-family: var(--font-num);
    }

    .rp-body { background: #fff; border-radius: 0 0 16px 16px; padding: 4px 0 20px; box-shadow: 0 10px 30px rgba(16, 24, 40, 0.07); }

    .rp-sec { padding: 18px 24px 4px; }
    .rp-sec h2 {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-2);
      letter-spacing: 0.4px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 4px;
    }

    .rp-kv { display: flex; padding: 9px 0; font-size: 13.5px; border-bottom: 1px dashed #eef1f6; }
    .rp-kv:last-child { border-bottom: 0; }
    .rp-kv .k { flex: 0 0 128px; color: var(--text-3); font-size: 12.5px; }
    .rp-kv .v { flex: 1; line-height: 1.65; }
    .rp-kv .v.num { font-family: var(--font-num); }

    .rp-node { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-bottom: 1px dashed #eef1f6; }
    .rp-node:last-child { border-bottom: 0; }
    .rp-node .n-ico {
      flex: 0 0 20px; height: 20px; border-radius: 50%;
      display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; margin-top: 1px;
    }
    .rp-node.ok .n-ico { background: var(--success); }
    .rp-node.bad .n-ico { background: var(--danger); }
    .rp-node.skip .n-ico { background: #c4ccd8; }
    .rp-node .n-name { font-size: 13.5px; font-weight: 600; }
    .rp-node .n-val { font-size: 12.5px; color: var(--text-2); line-height: 1.6; margin-top: 3px; }

    .rp-primary {
      margin: 14px 24px 0;
      background: var(--danger-soft);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .rp-primary h3 { font-size: 14.5px; color: #a8071a; font-weight: 800; }
    .rp-primary p { font-size: 13px; color: #7a0916; line-height: 1.75; margin-top: 7px; }

    .rp-foot { text-align: center; font-size: 11.5px; color: var(--text-3); line-height: 1.8; margin-top: 18px; }

    .rp-error {
      background: #fff; border-radius: 16px; padding: 46px 24px; text-align: center;
      box-shadow: 0 10px 30px rgba(16, 24, 40, 0.07);
    }
    .rp-error h1 { font-size: 17px; margin-bottom: 9px; }
    .rp-error p { font-size: 13px; color: var(--text-3); line-height: 1.8; }

    .rp-note {
      margin-top: 14px;
      background: #fff8e6;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 12px;
      color: #8a5a00;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="rp-wrap" id="wrap"></div>

  <script src="assets/js/mock.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(window.location.search);
      var res = MSS.reportStore.load(q.get('id'), q.get('token'));
      var wrap = document.getElementById('wrap');

      if (!res.ok) {
        wrap.innerHTML =
          '<div class="rp-error"><h1>无法查看该诊断报告</h1><p>' + res.msg +
          '<br>报告链接由商户端发起时生成，带一次性令牌且 2 小时后失效。</p></div>';
        return;
      }

      var rec = res.record;
      var d = rec.data;
      var m = d.merchant;
      var s = d.settlement;
      var diag = d.diagnosis;

      function kv(k, v, num) {
        return '<div class="rp-kv"><span class="k">' + k + '</span><span class="v' + (num ? ' num' : '') + '">' + v + '</span></div>';
      }

      wrap.innerHTML =
        '<div class="rp-head">' +
          '<h1>商户诊断报告 · 客服工作台视图</h1>' +
          '<p>由商户在' + (d.source === 'app' ? '盛意旺 App' : '微信公众号') +
            '自助服务助手中发起转人工时自动生成，客服无需重复询问商户信息。</p>' +
          '<div class="rp-tags"><span>报告编号 ' + rec.id + '</span>' +
            '<span>生成于 ' + rec.createdAt + '</span>' +
            '<span>有效期至 ' + rec.expireText + '</span></div>' +
        '</div>' +
        '<div class="rp-body">' +
          '<div class="rp-sec"><h2>商户信息</h2>' +
            kv('商户号', m.mchId, true) +
            kv('商户名称', m.name) +
            kv('产品线', m.line) +
            kv('接入渠道', d.source === 'app' ? '盛意旺 App（登录态识别）' : '微信公众号（OpenID 绑定关系）') +
            kv('转接原因', d.reason) +
          '</div>' +

          (s ? '<div class="rp-sec"><h2>结算信息与结算规则</h2>' +
            kv('结算卡', s.cardType + '账户 · ' + s.accountName) +
            kv('结算卡号', s.cardNo + '（' + s.bank + '）', true) +
            kv('结算周期 / 日切', s.cycle + ' · 每日 ' + s.cutoff) +
            kv('自动提现', s.autoWithdrawTime) +
            kv('预留金额', s.reserve + ' 元', true) +
            kv('出款服务类型', s.payoutService + '（' + s.payoutServiceDesc + '）') +
          '</div>' : '') +

          (diag
            ? (diag.primary
                ? '<div class="rp-primary"><h3>诊断结论：' + diag.primary.summary + '</h3><p>' + diag.primary.detail + '</p></div>'
                : '') +
              '<div class="rp-sec"><h2>诊断明细</h2>' +
                kv('诊断流水号', diag.traceId, true) +
                kv('诊断时间', diag.time) +
                (diag.userAction ? kv('商户已执行操作', diag.userAction) : '') +
                (diag.feedback ? kv('商户反馈', diag.feedback) : '') +
                '<div style="margin-top:6px">' +
                  diag.nodes.map(function (n) {
                    return '<div class="rp-node ' + n.state + '">' +
                      '<span class="n-ico">' + (n.state === 'bad' ? '!' : n.state === 'skip' ? '–' : '✓') + '</span>' +
                      '<span><span class="n-name">' + n.name + '</span>' +
                      '<span class="n-val">' + n.value + '</span></span></div>';
                  }).join('') +
                '</div>' +
              '</div>'
            : '<div class="rp-sec"><h2>诊断明细</h2>' +
                '<div class="rp-kv"><span class="v">商户未执行自助诊断即转接人工（如「其他问题」入口），仅同步商户档案与结算信息。</span></div>' +
              '</div>') +
        '</div>' +
        '<div class="rp-note">演示说明：本页模拟「诊断报告独立链接」方案。真实实现中报告数据存于服务端，链接携带一次性令牌与有效期，' +
          '客服在一洽工作台点击图文消息即可打开；商户侧不可见客服专属链接。</div>' +
        '<div class="rp-foot">商户自助服务助手（一期）· 演示环境<br>报告内容按脱敏规则展示，不含完整卡号与证件信息</div>';
    })();
  </script>
</body>
</html>
